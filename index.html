<script>
const $=id=>document.getElementById(id),MAXPX=2200;
const SLOTS=[['photo','Passport photo','photo','orig'],['consent','Aadhaar consent form','aadhaar_consent','color'],['aadhaar','Aadhaar card','aadhaar','color'],['bank','Bank passbook','bank_passbook','color'],['voter','Voter ID (EPIC)','voter','color'],['pan','PAN card','pan','color'],['caste','Caste certificate','caste','color'],['ration','Digital ration card','ration','color'],['other','Other document','other','color']];

/* ---------- Edge detection (paper vs background, Otsu + largest blob) ---------- */
function detect(c){
  const k=200/Math.max(c.width,c.height),w=Math.round(c.width*k),h=Math.round(c.height*k);
  const t=document.createElement('canvas');t.width=w;t.height=h;
  const x=t.getContext('2d');x.drawImage(c,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,n=w*h,g=new Uint8Array(n),hist=new Array(256).fill(0);
  for(let i=0;i<n;i++){g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];hist[g[i]]++}
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
  let wb=0,sb=0,best=0,th=128;
  for(let i=0;i<256;i++){wb+=hist[i];if(!wb)continue;const wf=n-wb;if(!wf)break;
    sb+=i*hist[i];const v=wb*wf*Math.pow(sb/wb-(sum-sb)/wf,2);if(v>best){best=v;th=i}}
  let m=new Uint8Array(n);for(let i=0;i<n;i++)m[i]=g[i]>th?1:0;
  let bd=0,bt=0;
  for(let i=0;i<w;i++){bd+=m[i]+m[(h-1)*w+i];bt+=2}
  for(let j=0;j<h;j++){bd+=m[j*w]+m[j*w+w-1];bt+=2}
  if(bd/bt>.5)for(let i=0;i<n;i++)m[i]^=1;
  const lab=new Int32Array(n),st=new Int32Array(n);let id=0,bid=0,bc=0;
  for(let s=0;s<n;s++){
    if(!m[s]||lab[s])continue;
    id++;let sp=0,cnt=0;st[sp++]=s;lab[s]=id;
    while(sp){const p=st[--sp];cnt++;const px=p%w,py=(p/w)|0;
      if(px>0&&m[p-1]&&!lab[p-1]){lab[p-1]=id;st[sp++]=p-1}
      if(px<w-1&&m[p+1]&&!lab[p+1]){lab[p+1]=id;st[sp++]=p+1}
      if(py>0&&m[p-w]&&!lab[p-w]){lab[p-w]=id;st[sp++]=p-w}
      if(py<h-1&&m[p+w]&&!lab[p+w]){lab[p+w]=id;st[sp++]=p+w}}
    if(cnt>bc){bc=cnt;bid=id}
  }
  const W=c.width,H=c.height,ins=.06;
  const fb=[[W*ins,H*ins],[W*(1-ins),H*ins],[W*(1-ins),H*(1-ins)],[W*ins,H*(1-ins)]];
  if(!bid||bc/n<.15||bc/n>.97)return null;
  let tl=[0,1e9],br=[0,-1e9],tr=[0,-1e9],bl=[0,1e9];
  for(let p=0;p<n;p++){if(lab[p]!==bid)continue;const px=p%w,py=(p/w)|0,a=px+py,b=px-py;
    if(a<tl[1])tl=[p,a];if(a>br[1])br=[p,a];if(b>tr[1])tr=[p,b];if(b<bl[1])bl=[p,b]}
  return [tl,tr,br,bl].map(o=>[(o[0]%w)/k,((o[0]/w)|0)/k]);
}

/* ---------- Perspective warp (full resolution, bilinear) ---------- */
function warp(P){
  const src=P.src,quad=P.quad;
  const[p0,p1,p2,p3]=quad,dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let W=(dist(p0,p1)+dist(p3,p2))/2,H=(dist(p0,p3)+dist(p1,p2))/2;
  const k=Math.min(1,MAXPX/Math.max(W,H));W=Math.max(2,Math.round(W*k));H=Math.max(2,Math.round(H*k));
  const[x0,y0]=p0,[x1,y1]=p1,[x2,y2]=p2,[x3,y3]=p3;
  const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
  const den=dx1*dy2-dx2*dy1||1e-9,g=(dx3*dy2-dx2*dy3)/den,h=(dx1*dy3-dx3*dy1)/den;
  const a=x1-x0+g*x1,b=x3-x0+h*x3,d=y1-y0+g*y1,e=y3-y0+h*y3;
  const sw=src.width,sh=src.height,S=src.getContext('2d').getImageData(0,0,sw,sh).data;
  const o=document.createElement('canvas');o.width=W;o.height=H;
  const ox=o.getContext('2d'),od=ox.createImageData(W,H),O=od.data;
  for(let y=0;y<H;y++){const v=y/(H-1);
    for(let x=0;x<W;x++){const u=x/(W-1),q=g*u+h*v+1;
      let sx=(a*u+b*v+x0)/q,sy=(d*u+e*v+y0)/q;
      sx=Math.min(sw-1.001,Math.max(0,sx));sy=Math.min(sh-1.001,Math.max(0,sy));
      const ix=sx|0,iy=sy|0,fx=sx-ix,fy=sy-iy,i=(iy*sw+ix)*4,j=i+sw*4,oi=(y*W+x)*4;
      for(let c=0;c<3;c++)O[oi+c]=(S[i+c]*(1-fx)+S[i+4+c]*fx)*(1-fy)+(S[j+c]*(1-fx)+S[j+4+c]*fx)*fy;
      O[oi+3]=255}}
  ox.putImageData(od,0,0);return o;
}

/* ---------- Filters (local-mean shadow removal) ---------- */
function filt(c,bw){
  const w=c.width,h=c.height,id=c.getContext('2d').getImageData(0,0,w,h),d=id.data,W1=w+1;
  const I=new Uint32Array(W1*(h+1)),G=new Uint8Array(w*h);
  for(let y=0;y<h;y++){let r=0;for(let x=0;x<w;x++){const i=y*w+x,p=i*4;
    G[i]=(d[p]*77+d[p+1]*150+d[p+2]*29)>>8;r+=G[i];I[(y+1)*W1+x+1]=I[y*W1+x+1]+r}}
  const R=Math.max(12,(w/30)|0);
  for(let y=0;y<h;y++){const a=Math.max(0,y-R),b=Math.min(h,y+R+1);
    for(let x=0;x<w;x++){const l=Math.max(0,x-R),r=Math.min(w,x+R+1),
      m=(I[b*W1+r]-I[a*W1+r]-I[b*W1+l]+I[a*W1+l])/((r-l)*(b-a)),p=(y*w+x)*4;
      if(bw){const v=Math.min(1,Math.max(0,(G[y*w+x]/(m+1)-.72)/.18))*255;d[p]=d[p+1]=d[p+2]=v}
      else{const k=Math.min(1.8,Math.max(1,235/(m+1)));
        for(let q=0;q<3;q++)d[p+q]=(d[p+q]*k-128)*1.12+128}}}
  const o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').putImageData(id,0,0);return o;
}



/* ---------- Page loading ---------- */
async function addFiles(files){
  files=[...files];if(!files.length)return;
  const first=pages.length;
  for(const file of files){
    const url=URL.createObjectURL(file),img=new Image();img.src=url;
    try{await img.decode()}catch(e){continue}
    const k=Math.min(1,MAXPX/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    pages.push({id:++uid,src:c,quad:detect(c),dirty:true,ver:0,f:{}});
    await tick();
  }
  if(pages.length>first){sel=first;show('crop')}
}

/* ---------- Crop UI ---------- */
const cv=$('cv'),ratio=()=>cv.width/(cv.getBoundingClientRect().width||cv.width);
function draw(){
  const P=pages[sel];if(!P)return;
  scale=Math.min(1,1000/Math.max(P.src.width,P.src.height));
  cv.width=Math.round(P.src.width*scale);cv.height=Math.round(P.src.height*scale);
  const x=cv.getContext('2d'),r=ratio(),Q=P.quad.map(q=>[q[0]*scale,q[1]*scale]);
  $('cinfo').textContent='Page '+(sel+1)+' / '+pages.length+' — drag the green corners to adjust the edges.';
  x.drawImage(P.src,0,0,cv.width,cv.height);
  const path=()=>{x.beginPath();Q.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath()};
  x.beginPath();x.rect(0,0,cv.width,cv.height);Q.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();
  x.fillStyle='rgba(0,0,0,.5)';x.fill('evenodd');
  path();x.strokeStyle='#22c55e';x.lineWidth=3*r;x.stroke();
  Q.forEach(p=>{x.beginPath();x.arc(p[0],p[1],13*r,0,7);x.fillStyle='#22c55e';x.fill();x.lineWidth=2*r;x.strokeStyle='#fff';x.stroke()});
}
const pt=e=>{const b=cv.getBoundingClientRect(),r=ratio();return[(e.clientX-b.left)*r,(e.clientY-b.top)*r]};
cv.onpointerdown=e=>{const P=pages[sel],p=pt(e);let bd=1e9;drag=-1;
  P.quad.forEach((q,i)=>{const d=Math.hypot(q[0]*scale-p[0],q[1]*scale-p[1]);if(d<bd){bd=d;drag=i}});
  if(bd>70*ratio())drag=-1;else cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(drag<0)return;const P=pages[sel],p=pt(e);
  P.quad[drag]=[Math.min(P.src.width,Math.max(0,p[0]/scale)),Math.min(P.src.height,Math.max(0,p[1]/scale))];P.dirty=true;draw()};
cv.onpointerup=()=>{drag=-1;save()};
$('redo').onclick=()=>{const P=pages[sel];P.quad=detect(P.src);P.dirty=true;draw()};

  const b=$('ok');b.textContent='Processing…';
  for(const P of pages)if(P.dirty||!P.warped){await tick();P.warped=warp(P);P.f={};P.ver++;P.dirty=false}
  b.textContent='Confirm & continue ✓';show('res');
};



const quadArea=q=>Math.abs(q.reduce((a,p,i)=>a+(p[0]*q[(i+1)%4][1]-q[(i+1)%4][0]*p[1]),0))/2;

/* ================= DESKTOP ================= */
async function compress(c,T){
  const enc=(cv,q)=>new Promise(r=>cv.toBlob(r,'image/jpeg',q));let b;
  for(const sc of [1,.8,.65,.5,.4,.3]){
    const cv=document.createElement('canvas');cv.width=Math.round(c.width*sc);cv.height=Math.round(c.height*sc);
    const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.imageSmoothingQuality='high';x.drawImage(c,0,0,cv.width,cv.height);
    b=await enc(cv,.92);if(b.size<=T)return b;
    let lo=.6,hi=.92,ok=null;
    for(let k=0;k<6;k++){const m=(lo+hi)/2,t=await enc(cv,m);if(t.size<=T){ok=t;lo=m}else hi=m}
    if(ok)return ok;
  }
  return b;
}
function deskMode(){
  $('desk').classList.remove('hide');
  const id=localStorage.dbid||(localStorage.dbid='db'+Math.random().toString(36).slice(2,10));
  const url=location.origin+location.pathname+'#p='+id;
  if(location.protocol==='file:')$('hint').innerHTML='⚠ Open this page from your HTTPS website (not a local file), otherwise the phone cannot open it.';
  else new QRCode($('qr'),{text:url,width:150,height:150});
  const S=SLOTS.map(s=>({key:s[0],label:s[1],short:s[2],mode:s[3],kb:100,rot:0,base:null,blob:null,custom:false}));
  let cur=0,conn,dirH=null;
  const clean=t=>t.trim().replace(/[^\w\-. ]+/g,'_');
  const auto=s=>($('prefix').value.trim()?clean($('prefix').value)+'_':'')+s.short;
  const fn=s=>(clean(s.el.nm.value)||auto(s))+'.jpg';
  const sendSlot=()=>conn&&conn.open&&conn.send({t:'slot',label:cur>=0?S[cur].label:'',i:cur,n:S.length});
  function sel(){S.forEach((s,i)=>{s.el.d.classList.toggle('cur',i===cur);if(!s.base)s.el.st.textContent=i===cur?'📷 Show this document to the phone':'—'})}
  async function save(s){if(!dirH||!s.blob)return;try{const w=await(await dirH.getFileHandle(fn(s),{create:true})).createWritable();await w.write(s.blob);await w.close()}catch(e){}}
  async function proc(s){
    if(!s.base)return;let c=s.base;
    if(s.rot){const r=document.createElement('canvas'),o=s.rot%180;r.width=o?c.height:c.width;r.height=o?c.width:c.height;const x=r.getContext('2d');x.translate(r.width/2,r.height/2);x.rotate(s.rot*Math.PI/180);x.drawImage(c,-c.width/2,-c.height/2);c=r}
    if(s.mode!=='orig')c=filt(c,s.mode==='bw');
    s.blob=await compress(c,s.kb*1024);
    const t=s.el.th;t.width=240;t.height=Math.round(240*c.height/c.width);t.getContext('2d').drawImage(c,0,0,t.width,t.height);
    const kb=Math.round(s.blob.size/1024);s.el.st.textContent=(s.blob.size<=s.kb*1024?'✓ ':'⚠ ')+kb+' KB';
    s.el.st.className='st '+(s.blob.size<=s.kb*1024?'ok':'bad');save(s);
  }
  S.forEach((s,i)=>{
    const d=document.createElement('div');d.className='card slot';
    d.innerHTML=`<div class="hd"><b>${i+1}. ${s.label}</b><span class="st"></span></div><div class="bd"><canvas class="th" width="240" height="150"></canvas><div class="ct">
    <div class="row"><input class="nm" style="flex:1" placeholder="file name"><span>.jpg</span></div>
    <div class="row"><select class="md"><option value="orig">Original</option><option value="color">Color</option><option value="bw">B&amp;W</option></select><label>Max <input class="kb" type="number" min="20" value="100"> KB</label></div>
    <div class="row"><button class="sec rt">↻ Rotate</button><button class="sec rs">Rescan</button><button class="dl">⬇ Download</button></div></div></div>`;
    const q=x=>d.querySelector(x);s.el={d,st:q('.st'),th:q('.th'),nm:q('.nm')};
    s.el.nm.value=auto(s);q('.md').value=s.mode;$('list').append(d);
    s.el.nm.oninput=()=>s.custom=true;s.el.nm.onchange=()=>save(s);
    q('.md').onchange=e=>{s.mode=e.target.value;proc(s)};q('.kb').onchange=e=>{s.kb=Math.max(20,+e.target.value||100);proc(s)};
    q('.rt').onclick=()=>{s.rot=(s.rot+90)%360;proc(s)};q('.rs').onclick=()=>{cur=i;sel();sendSlot()};
    q('.dl').onclick=()=>{if(!s.blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(s.blob);a.download=fn(s);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
  });
  $('prefix').oninput=()=>S.forEach(s=>{if(!s.custom)s.el.nm.value=auto(s)});
  $('dir').onclick=async()=>{if(!window.showDirectoryPicker){alert('Folder saving needs desktop Chrome or Edge.');return}
    try{dirH=await showDirectoryPicker({mode:'readwrite'});$('dir').textContent='📁 Saving to: '+dirH.name;S.forEach(save)}catch(e){}};
  async function onData(d){
    if(!d||d.t!=='img'||cur<0)return;
    const s=S[cur],bmp=await createImageBitmap(new Blob([d.buf],{type:'image/jpeg'}));
    const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;c.getContext('2d').drawImage(bmp,0,0);
    s.base=c;s.rot=0;const i=cur;
    const nx=S.findIndex((x,j)=>j>i&&!x.base);cur=nx>=0?nx:S.findIndex(x=>!x.base);
    sel();sendSlot();conn.send({t:'ack',label:s.label});await proc(s);
  }
  const peer=new Peer(id);
  peer.on('open',()=>$('conn').textContent='Waiting for phone…');
  peer.on('connection',c=>{conn=c;c.on('open',()=>{$('conn').textContent='📱 Phone connected, start scanning';sendSlot()});
    c.on('data',onData);c.on('close',()=>$('conn').textContent='Phone disconnected')});
  peer.on('error',e=>{if(e.type==='unavailable-id'){localStorage.removeItem('dbid');location.reload()}else $('conn').textContent='Connection problem ('+e.type+'). Reload this page.'});
  sel();
}

/* ================= PHONE ================= */
async function phoneMode(id){
  $('phone').classList.remove('hide');document.body.classList.add('ph');
  const v=$('v'),ov=$('ov'),poly=$('poly'),say=t=>$('msg').textContent=t;
  let conn,paused=true,last=null,lk=1,stab=0,lost=0,armed=true,facing='environment',stream;
  const peer=new Peer();
  const connect=()=>{conn=peer.connect(id,{reliable:true});
    conn.on('open',()=>{paused=false;say('Connected ✓')});
    conn.on('data',d=>{if(d.t==='slot'){paused=d.i<0;$('top').textContent=d.i<0?'✅ All documents scanned':'Show: '+d.label+'  ('+(d.i+1)+'/'+d.n+')'}
      if(d.t==='ack'){say('✓ Sent: '+d.label);navigator.vibrate&&navigator.vibrate(120)}});
    conn.on('close',()=>{paused=true;say('Disconnected, reconnecting…');setTimeout(connect,2000)})};
  peer.on('open',connect);peer.on('error',e=>say('Connection problem: '+e.type));
  async function cam(){
    if(stream)stream.getTracks().forEach(t=>t.stop());
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:2560},height:{ideal:1440}},audio:false});
      v.srcObject=stream;await v.play();try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    }catch(e){say('Camera blocked: allow camera access and reload.')}
  }
  await cam();try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
  $('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';cam()};
  function capture(quad){
    armed=false;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
    const q=quad||[[0,0],[c.width,0],[c.width,c.height],[0,c.height]];
    warp({src:c,quad:q}).toBlob(async b=>{if(conn&&conn.open)conn.send({t:'img',buf:await b.arrayBuffer()})},'image/jpeg',.92);
    const f=$('flash');f.style.transition='none';f.style.opacity=.8;requestAnimationFrame(()=>{f.style.transition='opacity .35s';f.style.opacity=0});
    say('Sending…');
  }
  $('snap').onclick=()=>{if(!paused&&v.videoWidth)capture(last&&last.map(p=>[p[0]/lk,p[1]/lk]))};
  const an=document.createElement('canvas');
  setInterval(()=>{
    if(!v.videoWidth)return;
    ov.setAttribute('viewBox','0 0 '+v.videoWidth+' '+v.videoHeight);
    if(paused){poly.setAttribute('points','');return}
    const k=240/Math.max(v.videoWidth,v.videoHeight);an.width=Math.round(v.videoWidth*k);an.height=Math.round(v.videoHeight*k);
    an.getContext('2d').drawImage(v,0,0,an.width,an.height);
    const q=detect(an),good=q&&quadArea(q)/(an.width*an.height)>.18&&quadArea(q)/(an.width*an.height)<.96;
    if(!good){poly.setAttribute('points','');last=null;stab=0;if(++lost>=5&&!armed){armed=true;say('Show the next document')}else if(armed)say('Place the document in view on a plain, contrasting surface');return}
    lost=0;poly.setAttribute('points',q.map(p=>(p[0]/k)+','+(p[1]/k)).join(' '));
    const diag=Math.hypot(an.width,an.height),mv=last?Math.max(...q.map((p,i)=>Math.hypot(p[0]-last[i][0],p[1]-last[i][1])))/diag:1;
    stab=mv<.03?stab+1:0;last=q;lk=k;
    if(!armed)return;
    if(stab>=5)capture(q.map(p=>[p[0]/k,p[1]/k]));else say('Hold steady… '+Math.min(99,stab*20)+'%');
  },200);
}
/^#p=/.test(location.hash)?phoneMode(location.hash.slice(3)):deskMode();
